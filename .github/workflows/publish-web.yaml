name: Publish Web
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-web
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: hooks/mkdocs_hook.py dates every sitemap <lastmod> from git,
          # and a shallow clone would fall back to the build date.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install safe-chain
        uses: OpenVidu/actions/install-safe-chain@26a149ff32c72503a7c7ce4fb5fa4d000cb3262d # 1.0.25

      - name: Install dependencies
        run: |
          # System libraries for mkdocs-material[imaging] (the optimize and privacy plugins).
          sudo apt-get update
          sudo apt-get install --fix-missing libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev
          sudo apt-get install -y --fix-missing pngquant
          # Pinned to the same versions openvidu.io publishes with, so the shared
          # tutorials render identically on both sites.
          pip install mkdocs==1.6.1 "mkdocs-material[imaging]==9.8.0" pymdown-extensions==12.3 pygments==2.21.0 mkdocs-glightbox==0.5.3 mkdocs-llmstxt==0.5.1

      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Publish
        env:
          GOOGLE_ANALYTICS_KEY: ${{ secrets.GOOGLE_ANALYTICS_KEY }}
        run: mkdocs gh-deploy --strict --force

name: Publish Web
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-web
env:
  GOOGLE_ANALYTICS_KEY: ${{ secrets.GOOGLE_ANALYTICS_KEY }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Install safe-chain
        uses: OpenVidu/actions/install-safe-chain@070fb73fda8fe7a08e28991b1c2d276f12a009ef # v1.0.22
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      # Pinned to the same versions openvidu.io publishes with, so the shared
      # tutorials render identically on both sites.
      - run: pip install mkdocs==1.6.1 mkdocs-material==9.7.6 pymdown-extensions==11.0.1 mkdocs-glightbox==0.5.2 mkdocs-llmstxt==0.5.0
      - run: |
          export GOOGLE_ANALYTICS_KEY="$GOOGLE_ANALYTICS_KEY"
          mkdocs gh-deploy --force

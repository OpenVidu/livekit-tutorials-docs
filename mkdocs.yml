site_name: LiveKit Tutorials
site_url: https://livekit-tutorials.openvidu.io/
site_description: Discover comprehensive LiveKit tutorials for building real-time audio and video apps. Explore client and server guides for multiple platforms.
repo_name: openvidu/openvidu-livekit-tutorials
repo_url: https://github.com/openvidu/openvidu-livekit-tutorials
# Absolute on purpose: edit links point at this repo, not repo_url (the tutorials' code repo).
edit_uri: https://github.com/OpenVidu/livekit-tutorials-docs/edit/main/docs/

nav:
  - Home: index.md
  - What is OpenVidu?: about-openvidu.md
  - OpenVidu vs LiveKit: openvidu-vs-livekit.md
  - Application Server:
      - tutorials/application-server/index.md
      - Node.js: tutorials/application-server/node.md
      - Go: tutorials/application-server/go.md
      - Ruby: tutorials/application-server/ruby.md
      - Java: tutorials/application-server/java.md
      - Python: tutorials/application-server/python.md
      - Rust: tutorials/application-server/rust.md
      - PHP: tutorials/application-server/php.md
      - .NET: tutorials/application-server/dotnet.md
  - Application Client:
      - tutorials/application-client/index.md
      - JavaScript: tutorials/application-client/javascript.md
      - React: tutorials/application-client/react.md
      - Angular: tutorials/application-client/angular.md
      - Vue: tutorials/application-client/vue.md
      - Electron: tutorials/application-client/electron.md
      - Ionic: tutorials/application-client/ionic.md
      - Android: tutorials/application-client/android.md
      - iOS: tutorials/application-client/ios.md
  - Advanced Features:
      - tutorials/advanced-features/index.md
      - Recording Basic: tutorials/advanced-features/recording-basic.md
      - Recording Advanced: tutorials/advanced-features/recording-advanced.md

# Pages reached by direct link only, never through the nav.
not_in_nav: |
  /conditions/

# Sitemap <lastmod> from git, the build year, the openvidu.io counterpart boxes, and
# every page's own title and description for llmstxt.
hooks:
  - hooks/mkdocs_hook.py

watch:
  - shared
  - overrides
  - hooks

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn
    anchors: info

theme:
  name: material
  custom_dir: overrides
  language: en
  features:
    - announce.dismiss
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.footer
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
  # main.html loads the one font stylesheet; --md-text-font/--md-code-font are in extra.css.
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github
  favicon: assets/images/logos/logo.png
  # The globe mark rather than openvidu.io's wordmark: the header already carries this
  # site's own name beside it.
  logo: assets/images/logos/openvidu_globe_bg_transp_cropped.png

plugins:
  - meta
  - search
  # Self-hosts the Google Fonts stylesheet at build time, so no page makes a
  # third-party request before the visitor has answered the cookie banner.
  - privacy:
      enabled: !ENV [CI, true]
      # Material's bundle names the mermaid CDN, so the plugin vendors 3.5 MB of
      # it. This site has no mermaid fence configured and no page uses one.
      assets_exclude:
        - unpkg.com/*
  # Runs only in the publish workflow (CI=true), which installs
  # mkdocs-material[imaging] and pngquant; local builds skip it.
  - optimize:
      enabled: !ENV [CI, false]
      # The default 60 visibly softens the screenshots.
      optimize_jpg_quality: 82
      # pngquant's palette is capped at 256 colours, so search effort is its only quality lever.
      optimize_png_speed: 1
  - glightbox:
      width: 100%
      skip_classes:
        - skip-gallery
      auto_themed: true
      background: none
      shadow: false
  - llmstxt:
      markdown_description: >-
        Hands-on tutorials for building real-time audio and video applications on LiveKit,
        with application servers in eight languages, clients for eight platforms and recording
        guides. Every tutorial also runs unchanged on OpenVidu (https://openvidu.io), the
        self-hosted, LiveKit-compatible platform maintained by this site's authors — use it to
        deploy and self-host what you build here. The "Optional" section at the end holds
        legal pages, and can be skipped when a shorter context is needed.
      # The plugin's own cleaning drops every <img>/<svg> before the preprocess hook runs, so
      # llmstxt_preprocess.py reimplements it and keeps alt text, table icons and tab labels.
      autoclean: false
      preprocess: hooks/llmstxt_preprocess.py
      # Paths only: mkdocs_hook.py fills in each page's own `title` and `description`, and a
      # listed page missing either fails the build.
      sections:
        Start here:
        - index.md
        - about-openvidu.md
        - openvidu-vs-livekit.md

        Application server tutorials:
        - tutorials/application-server/*.md

        Application client tutorials:
        - tutorials/application-client/*.md

        Advanced features tutorials:
        - tutorials/advanced-features/*.md

        Optional:
        - conditions/*.md

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"
      permalink_title: Anchor link to this section for reference
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.snippets:
      base_path: [!relative $config_dir/shared]
      check_paths: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.blocks.caption
  - pymdownx.blocks.html

extra:
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
    # Rendered only after the visitor accepts the analytics cookie.
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/OpenVidu/livekit-tutorials-docs/issues/new?labels=documentation&amp;title=Docs%20feedback:%20{title}&amp;body=Feedback%20about%20https://livekit-tutorials.openvidu.io{url}%0A%0A(Tell%20us%20what%20you%20were%20looking%20for)" target="_blank" rel="noopener">opening a quick GitHub issue</a>.
  generator: false
  social:
    - icon: simple/github
      link: https://github.com/OpenVidu
    - icon: simple/x
      link: https://x.com/openvidu
    - icon: simple/medium
      link: https://openvidu.medium.com/
    - icon: simple/youtube
      link: https://www.youtube.com/@openvidu
  consent:
    title: Cookie consent
    description: >
      This website uses cookies to ensure you get the best experience on our website.
      <a href="/conditions/cookie-policy/" target="_blank">See cookie policy</a>
    cookies:
      analytics:
        name: Google Analytics
        checked: true
    actions:
      - accept
      - reject
      - manage

extra_css:
  - stylesheets/colors.css
  - stylesheets/extra.css
  - stylesheets/unsemantic-grid.css

# {year} is replaced with the build year by hooks/mkdocs_hook.py
copyright: >
  {year} &copy; OpenVidu<br>
  <a href="#__consent">Change cookie settings</a>
